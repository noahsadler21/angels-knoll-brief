<script id="data">
let BLOCKS = [{"t":"h1","html":"Part I. Executive summary","id":"h1","text":"Part I. Executive summary"},{"t":"h2","html":"Angels Knoll: A Legible Route","id":"h2","text":"Angels Knoll: A Legible Route"},{"t":"p","html":"<i>For a development partner<\/i>"},{"t":"p","html":"Angels Knoll has been fenced for more than a decade. The site has had many designs, and each one has depended on money and policy lining up, which they never have. In this sense the Knoll is a problem of politics before it is a problem of form. We are architects, so we do not own the land, hold the money or cast the votes. What we can design is the route through the rules that already exist."},{"t":"p","html":"The last scheme here was a spectacle, and it was never built. We are after something legible instead, where a developer, a lender or a board member can follow who pays, who builds and who benefits."},{"t":"h3","html":"The premise","id":"h3","text":"The premise"},{"t":"p","html":"Angels Knoll has been too difficult to develop. Cleared of its Victorian houses in the 1960s<span class=\"cite\" data-k=\"T-LH\">&#8203;<\/span>, it was meant for Three California Plaza, a 950 ft tower that could not be financed in the early-1990s office slump<span class=\"cite\" data-k=\"T-CP\">&#8203;<\/span>. Since 2017, every attempt has stalled on a $45–50 million land price paid in cash before a construction loan can close<span class=\"cite\" data-k=\"139\">&#8203;<\/span>. We propose to remove most of that price. The developer rebuilds the Metro station beneath the site, at roughly $45–50 million (working estimate), and that work is written into the sale and recorded on the land. Priced at its fair reuse value, which state law defines as the land's value \"at the use and with the covenants and conditions and development costs authorized by the sale\" (HSC 33433)<span class=\"cite\" data-k=\"T-HSC\">&#8203;<\/span>, and confirmed by an appraisal that CRA/LA's Oversight Board approves, the land costs close to nothing in cash. The same money raises what the finished building is worth: a tower with its own station is the asset LACERA, or an equivalent pension fund, buys at completion. In short, the station absorbs the land cost, and the buyout lowers the developer's risk."},{"t":"h3","html":"The process we propose","id":"h4","text":"The process we propose"},{"t":"p","html":"For a developer, the barrier on this site has always been the land payment. The parcel was appraised at $45.7 million in 2017<span class=\"cite\" data-k=\"139\">&#8203;<\/span>, and that price must be paid in cash at closing, before construction debt is available, on a sloped site above an active subway. We propose to substitute most of that payment with a renovation of, and addition to, the Metro station. The rebuilt 4th St west entrance, a public lift to Olive Street and the park are written into the solicitation as required public improvements and recorded against the land, so the parcel is appraised subject to those obligations and its value falls by approximately their cost. At our working estimate of $45 million for the station works, the cash land price approaches zero. The developer's return remains a market return. What changes is the risk profile: lower equity at closing, no acquisition debt, and a building connected to the station by its own public lift. The entitlement path is defined. About 600 homes in one tower is roughly 6.8:1 FAR, within the 9:1 the zoning allows by right (our estimate), and the 2025 infill exemption from CEQA (PRC 21080.66) replaces an environmental impact report with a 35-day challenge period<span class=\"cite\" data-k=\"80\">&#8203;<\/span><span class=\"cite\" data-k=\"90\">&#8203;<\/span>. The prevailing-wage requirement the exemption attaches to buildings over 85 feet is carried in the construction budget<span class=\"cite\" data-k=\"84\">&#8203;<\/span>."},{"t":"p","html":"Sequencing matters as much as price. Before the solicitation is issued, a nonprofit conservancy formed with the DTLA Alliance, the site's current maintenance contractor<span class=\"cite\" data-k=\"133\">&#8203;<\/span>, opens the Knoll as a park under a lease with no development, which is not a disposal under the Surplus Land Act. The conservancy's operating role and funding are then written into CRA/LA's open competitive solicitation for 300 or more homes, at least 25 percent restricted to lower-income households for 55 years under Gov. Code 54221(f)(1)(G)<span class=\"cite\" data-k=\"65\">&#8203;<\/span>, so the selected developer funds the park's operation. The solicitation remains open to all qualified bidders. Our advantage is limited to design knowledge of the station and an established working relationship with Metro, which retains its existing entrance rights and joins as co-applicant for state AHSC funding<span class=\"cite\" data-k=\"121\">&#8203;<\/span>. The project is held as two ownership parcels: a tax-credit affordable component, and a market-rate component that a long-term institutional owner, such as a pension fund, commits to purchase at completion under a forward purchase agreement. Four conditions remain open: a pro forma must confirm a residual land value at least equal to the station cost; a preliminary title report must confirm Metro's interest in the entrance; the Oversight Board must approve a sale price below the property plan's fair-market-value requirement; and the Angels Landing litigation must be resolved. If state law is amended first to permit long-term development leases, a 99-year ground lease is the alternative structure."},{"t":"h3","html":"Key ideas","id":"h5","text":"Key ideas"},{"t":"li","mk":"•","html":"Required station works, recorded on the land, replace most of the cash land price."},{"t":"li","mk":"•","html":"A market return, with lower equity at closing and no acquisition debt."},{"t":"li","mk":"•","html":"About 600 homes in one tower, within by-right zoning and the CEQA infill exemption."},{"t":"li","mk":"•","html":"A conservancy-run park first, then one open competition, with Metro as a partner."},{"t":"li","mk":"•","html":"Two ownership parcels with a forward purchase at completion; four open conditions, with a ground lease as the fallback."},{"t":"h1","html":"Part II. How this brief is organized","id":"h6","text":"Part II. How this brief is organized"},{"t":"p","html":"This document moves from the argument to the evidence. Each part answers one question a developer, a lender or a board member would ask."},{"t":"table","head":["Part","The question it answers","What it contains"],"rows":[["I. Executive summary","Why this site, why now, and why us?","The argument in one page and ten key ideas."],["II. How this brief is organized","Where do I find what?","This guide."],["III. The money trail","Where does the money go today, and where would it go?","Team research on how the parcel is paid for now, where a sale's proceeds go, and how our plan and his ground lease change that."],["IV.0 Opening","What is the problem, and what is our position?","Why money and politics, not design, kept the site empty, and what architects can offer."],["IV.1 Pathway at a glance","What happens, in what order, and who decides?","One table from the park lease to the pension purchase; the base case, its program and a rough block massing."],["IV.2 What our concept triggers","Which approvals does this building need?","Fifteen triggers: who decides, how long it takes, what we draw, by when, and what it unlocks."],["IV.3 What a developer needs","What must be true before a developer commits money?","Eight necessities, each tied to a deliverable we produce, and what happens if one fails."],["IV.4 What the architect prepares","What do we draw, and when?","Our deliverables from the interim park design to construction, stage by stage."],["IV.5 Timeline and critical path","How long does it take?","Durations, a fast and a planning case, the critical path and the outside dates."],["IV.6 Top five risks","What could stop it, and what would settle it?","The five largest risks, led by the financial test of land value against the station."],["IV.7 Alternatives","What if the base case changes?","Two towers, code maximum, the two-phase scheme, the Station Homes scheme and the ground-lease alternative."],["IV.8 Labels and terms","How do I read the numbers?","The labelling key and a short glossary."],["Sources","Where does each claim come from?","The numbered sources used."]]},{"t":"p","html":"Every number is labelled: a numbered source, a teammate's figure, or our own estimate, arithmetic or inference. A teammate's figure is theirs and has not been verified by us. This is studio work for the Syracuse University LA Studio, not legal, financial or investment advice."},{"t":"h1","html":"Part III. The money trail","id":"h7","text":"Part III. The money trail"},{"t":"p","html":"<i>This part summarises team research in 02_BRIEF\\MTA (MONEY-NOW.md, SALE-PROCEEDS-45M.md, MONEY-CHAIN.md and GROUND-LEASE-ROUTE.md, 29 Oct 2026)<span class=\"cite\" data-k=\"N04-3\">&#8203;<\/span><span class=\"cite\" data-k=\"T-SP\">&#8203;<\/span><span class=\"cite\" data-k=\"T-MC\">&#8203;<\/span><span class=\"cite\" data-k=\"N04-2\">&#8203;<\/span>. Its figures are drawn from the ROPS 26-27 schedule, CRA/LA staff reports and the County records it cites. Where our own research reads a point differently, the difference is marked.<\/i>"},{"t":"p","html":"The Knoll costs money every year and earns almost nothing. That is the starting point for every route, ours included."},{"t":"h2","html":"III.1 How the parcel is paid for today","id":"h8","text":"III.1 How the parcel is paid for today"},{"t":"p","html":"The fence is paid for by property tax on the rest of Bunker Hill. It runs in seven steps."},{"t":"pre","html":"   OWNERS OF NON-EXEMPT PROPERTY\n   inside the 1959 Bunker Hill boundary\n                   |\n                   |  ordinary property tax, no surcharge\n                   v\n   LA COUNTY AUDITOR-CONTROLLER\n                   |\n         +---------+---------+\n         |                   |\n   BASE-YEAR SHARE      INCREMENT\n   1959 valuation       everything above it\n         |                   |\n         v                   v\n   ORDINARY TAXING     REDEVELOPMENT PROPERTY\n   ENTITIES               TAX TRUST FUND\n                             |\n              ---- paid in strict order ----\n                             |\n         1st |  PASS-THROUGHS\n         2nd |  CRA/LA OBLIGATIONS\n             |  Bunker Hill bond ........ $17,138,000\n         3rd |  ADMINISTRATIVE ALLOWANCE\n         4th |  RESIDUAL  -&gt;  the taxing entities\n                             |\n                             v\n                          CRA/LA\n                             |\n                             |  Item 225 ......... $175,001\n                             |  every property it owns\n                             v\n                      DTLA ALLIANCE\n                      PO 26-0002\n                             |\n                             |  ~$109,000 a year\n                             v\n                        PARCEL Y-1\n                             |\n                             |  film rental\n                             v\n                        $3,000 a year\n                    [ the only income ]"},{"t":"li","mk":"1.","html":"<b>Owners pay ordinary property tax.<\/b> The towers, hotels, condominiums and shops inside the 1959 Bunker Hill project boundary pay their normal tax and nothing extra. Nonprofits such as the museums are exempt. The Knoll itself is government-owned and exempt, with a land value of $0 on the County roll (team research)."},{"t":"li","mk":"2.","html":"<b>The County splits every bill in two.<\/b> The part tied to the 1959 base-year value goes straight to the ordinary taxing bodies. The growth above it, the increment, goes into the Redevelopment Property Tax Trust Fund (team research)."},{"t":"li","mk":"3.","html":"<b>The trust fund pays in a fixed order.<\/b> Pass-throughs come first, then CRA/LA's approved obligations, then its administrative allowance, then a residual to the taxing bodies. This year's schedule is $77,210,910, against total outstanding obligations of $454,651,660. The Bunker Hill bond alone takes $17,138,000 this year (team research, ROPS 26-27)<span class=\"cite\" data-k=\"N04-3\">&#8203;<\/span>."},{"t":"li","mk":"4.","html":"<b>CRA/LA has one line for every property it owns.<\/b> Item 225, property disposition and maintenance, is $175,001 for the whole portfolio. Nothing in it is set aside for the Knoll's appraisal, marketing, notice or legal advice (team research)."},{"t":"li","mk":"5.","html":"<b>The DTLA Alliance guards the site.<\/b> Purchase order 26-0002 has grown to $197,000, running to 30 June 2027: about $109,000 a year for power washing, gates, locks, fencing and pest control (team research; CRA/LA staff report<span class=\"cite\" data-k=\"133\">&#8203;<\/span>)."},{"t":"li","mk":"6.","html":"<b>The only income is film rental:<\/b> about $3,000 a year (team research, from the property plan)."},{"t":"li","mk":"7.","html":"<b>The net is about minus $106,000 a year,<\/b> roughly 36 dollars out for every dollar in (team research)."},{"t":"table","head":["Today, per year","Amount"],"rows":[["Out: maintenance and security","about $109,000"],["In: film rental","about $3,000"],["In: property tax, ground rent, possessory interest tax","$0"],["Net","about –$106,000"]]},{"t":"p","html":"<b>The date that changes the arithmetic.<\/b> The 2014 Bunker Hill refunding bond matures on 1 December 2028. After that, increment from inside the 1959 boundary stops paying Bunker Hill debt and reaches the residual, which goes to the County, the City, LAUSD, the community college district and special districts. A new tower on the Knoll would add to that stream (team research)<span class=\"cite\" data-k=\"N04-3\">&#8203;<\/span>."},{"t":"h2","html":"III.2 Where the money would go if the land were sold","id":"h9","text":"III.2 Where the money would go if the land were sold"},{"t":"p","html":"The team's research works through a hypothetical $45,000,000 sale. It is not an appraisal: no current appraisal exists<span class=\"cite\" data-k=\"T-SP\">&#8203;<\/span>."},{"t":"pre","html":"                       BUYER\n                         |\n                         |  $45,000,000 (example, not an appraisal)\n                         v\n                      ESCROW\n               commission ~1%, title\n                         |\n                         v\n                      CRA/LA\n                         |\n            +------------+-------------+\n            |                          |\n     ENFORCEABLE                 TAXING ENTITIES\n     OBLIGATIONS                 as property tax\n     property plan,              HSC 34191.5(c)(2)(B)\n     Future Development               |\n     Task 5                           |\n            +--------+--------+--------+--------+\n            |        |        |        |        |\n         COUNTY    CITY    LAUSD    LACCD   SPECIAL\n                                            DISTRICTS\n            each by its share of the tax rate area"},{"t":"table","head":["Step","What happens","Source"],"rows":[["Buyer to escrow","$45,000,000. A broker's commission of about 1%, paid by the buyer in CRA/LA's 2020 sale to The Broad","Team research"],["Escrow to CRA/LA","The full price, if the buyer pays the commission","Team research"],["CRA/LA onward","In the team's reading, the proceeds are \"distributed as property tax to the taxing entities\" (HSC 34191.5(c)(2)(B))","Team research"],["The five recipients","The County, the City, LAUSD, LACCD and special districts, each by its tax-rate-area share. Each percentage point of share is worth $450,000 on $45M","Team research; its arithmetic"]]},{"t":"p","html":"<b>Where our research reads it differently.<\/b> The statute sends proceeds to the taxing bodies only where the property plan directs them \"for any purpose other than to fulfill an enforceable obligation\". CRA/LA's property plan says net sale proceeds \"will be used for Enforceable Obligations and/or held for eventual distribution to Affected Taxing Entities\" (LRPMP, Nov 2013 version)<span class=\"cite\" data-k=\"N01-6\">&#8203;<\/span>. CRA/LA's own 2024 Marlton Square memo says the same<span class=\"cite\" data-k=\"N01-8\">&#8203;<\/span>. So part of a sale could pay CRA/LA's debts before anything reaches the taxing bodies. Either way, the taxing bodies end up better off, because every dollar of debt paid from a sale is a dollar not drawn from their residual."},{"t":"p","html":"<b>Who reviews, and who receives.<\/b> The Oversight Board's seven members speak for the bodies that receive the money, and they review the price on their behalf. The Department of Finance receives nothing, but it protects the school share, which offsets state funding. That is why a price below market is the thing both bodies look at hardest (team research)."},{"t":"h2","html":"III.3 How our plan changes the trail","id":"h10","text":"III.3 How our plan changes the trail"},{"t":"p","html":"Under our plan the cash price is close to zero, because the developer pays for the land in station works. The money trail therefore changes shape."},{"t":"pre","html":"                  DEVELOPMENT TEAM\n             wins the (G) competition\n                         |\n                         |  cash price close to $0 (working assumption)\n                         |  station, lift, park and 25% affordable\n                         |  recorded as conditions of sale\n                         v\n                      CRA/LA\n                         |  Governing Board, then Oversight Board\n                         |  and DOF approve a price below the\n                         |  property plan's market-value rule\n                         v\n         +---------------+----------------+\n         |               |                |\n     STATION         THE PARK         THE TOWER\n     ENTRANCE        conservancy      ~600 homes\n     Metro runs it   runs it          on the tax roll\n         |               |                |\n         v               v                v\n     public access   public ground    PROPERTY TAX\n     to the hill                      reaches the residual\n                                      after 1 Dec 2028\n                                         |\n                                         v\n                                  THE TAXING ENTITIES"},{"t":"table","head":["","Today","Sale at $45M (example)","Our plan","Ground-lease alternative"],"rows":[["Cash at the sale","none","about $45M, once","close to $0 (our working assumption)","none at first; the land under the building is sold later"],["Where the land's value goes","nowhere: about –$106,000 a year","to CRA/LA's debts and the taxing bodies","into the station entrance, the lift and the park","into rent, then a second sale at stabilisation"],["Yearly income to the taxing bodies","none from the parcel","property tax on the new building","property tax on the tower, reaching them after the bond matures in Dec 2028","ground rent every year, then possessory interest tax"],["Who must agree","no one","Governing Board, Oversight Board, Department of Finance","the same boards, approving a price below the plan's market-value rule","the same boards, plus a City ordinance and a state law change"]]},{"t":"p","html":"The honest cost of our plan is that the taxing bodies give up about $45 million in cash and, in effect, pay for a station that Metro will run. What they get in return is a taxed tower instead of a fenced lot that costs them about $106,000 a year. Persuading the Oversight Board of that trade is the hardest step in the plan."},{"t":"p","html":"The money trail explains the plan's central bet: the land's value is spent once, in public, instead of sold once, in cash."},{"t":"h1","html":"Part IV. The brief in depth","id":"h11","text":"Part IV. The brief in depth"},{"t":"p","html":"<i>Noah Sadler's section: developer necessities, approvals and entitlements, and the architect's proposal package. Distilled from the reviewed v2 reference files in developer-approvals\\reference; see Part IV.8 for labels and terms.<\/i>"},{"t":"h2","html":"IV.0 Opening","id":"h12","text":"IV.0 Opening"},{"t":"p","html":"The Knoll is held shut by a purchase order. The stair gates are locked, and a Metro entrance sits at its corner leading up to a hill no one can use. CRA/LA, which owns the land, pays the DTLA Alliance to guard it until 30 Jun 2027, for $197,000<span class=\"cite\" data-k=\"133\">&#8203;<\/span>. The last scheme won a competition in 2017<span class=\"cite\" data-k=\"139\">&#8203;<\/span>, reached an unsigned term sheet in 2022 (team research<span class=\"cite\" data-k=\"5\">&#8203;<\/span>), and ended when the City's option expired on 30 Sep 2025<span class=\"cite\" data-k=\"129\">&#8203;<\/span>. Design was not the obstacle. Money and politics were: about $45.7M for the land in cash, to be paid before a single home could be financed, on a hillside above a live subway<span class=\"cite\" data-k=\"139\">&#8203;<\/span>; a chain of boards; and a falling-out between the City and its developer (team research<span class=\"cite\" data-k=\"5\">&#8203;<\/span>)."},{"t":"p","html":"We are architects. We don't own the land, hold the money or cast the votes, and we can't win the site alone, because CRA/LA chooses developers, not designers. What we offer a development partner is the route: every approval our concept triggers, who decides it, how long it takes and what we draw to unlock it. The last scheme reached for spectacle. This one is meant to be legible: who pays, who builds and who benefits."},{"t":"h2","html":"IV.1 Pathway at a glance","id":"h13","text":"IV.1 Pathway at a glance"},{"t":"table","head":["Stage","What happens","Who decides"],"rows":[["<b>Now<\/b>","A nonprofit conservancy formed with the DTLA Alliance opens the Knoll on a lease with no development or demolition: not a disposal under the Surplus Land Act<span class=\"cite\" data-k=\"65\">&#8203;<\/span>, UNVERIFIED under the dissolution law. We design the park; the conservancy holds the lease","Governing Board, or the CEO under a $100,000 delegation (team research<span class=\"cite\" data-k=\"N04-2\">&#8203;<\/span>, UNVERIFIED); possibly the Oversight Board"],["<b>Land<\/b>","Floor-area opinion → first appraisal → (G) competition → selection and exclusive negotiation (ENA) → (G) declaration at a regular meeting → Governing Board → Oversight Board (10-day notice) → DOF; HCD 30+ days before disposition<span class=\"cite\" data-k=\"65\">&#8203;<\/span><span class=\"cite\" data-k=\"75\">&#8203;<\/span><span class=\"cite\" data-k=\"76\">&#8203;<\/span><span class=\"cite\" data-k=\"116\">&#8203;<\/span>","CRA/LA; Oversight Board; DOF; HCD"],["<b>Price<\/b>","An appraisal subject to the recorded station, park and affordability obligations, under CRA/LA's property plan. A price below its fair-market-value rule needs the Oversight Board's approval<span class=\"cite\" data-k=\"N01-6\">&#8203;<\/span>","Oversight Board; DOF"],["<b>Entitlement<\/b>","PRC 21080.66 infill exemption from CEQA; 35-day suit window<span class=\"cite\" data-k=\"80\">&#8203;<\/span><span class=\"cite\" data-k=\"90\">&#8203;<\/span>","City Planning"],["<b>Permits<\/b>","Haul hearing, Metro and peer-review sign-offs, then the shoring permit","BBSC; Metro; LADBS"],["<b>Build<\/b>","Tower, station, climb to Olive, park: 3.5–4.5 years (my estimate)","Developer; Metro"],["<b>Stabilise<\/b>","A pension buys the market part under a forward commitment (team research<span class=\"cite\" data-k=\"N04-1\">&#8203;<\/span>)","Pension"]]},{"t":"p","html":"<b>Base case.<\/b> About 600 homes, a quarter lower-income for 55 years (about 150; my arithmetic), in one tower of about 55–60 storeys, about 580–685 ft, and about 650,000 gsf, about 6.8:1 on 96,056 sf, inside the 9:1 base (my estimate); no hotel, resident parking, clinic or federal money; Metro keeps its entrance right and gets no land; and a $45M station (our decision; team figure). Each stage has a decider. None of them is us."},{"t":"h3","html":"Program","id":"h14","text":"Program"},{"t":"table","head":["Program","Size","Notes"],"rows":[["Homes","About 600: about 150 lower-income for 55 years and about 450 market (my arithmetic)","A quarter affordable, as the (G) exemption requires<span class=\"cite\" data-k=\"65\">&#8203;<\/span>"],["Residential floor area","About 650,000 gsf, at about 1,080 gsf a home (my estimate)","About 6.8:1 on 96,056 sf; the base allows 9:1<span class=\"cite\" data-k=\"165\">&#8203;<\/span>"],["Tower","One, on the upper hill by Olive, base about EL 352; 55–60 storeys, about 580–685 ft above its base; plate about 12,000–14,000 gsf, 10–12 homes a floor (my estimate)<span class=\"cite\" data-k=\"T-NS\">&#8203;<\/span>","Height thresholds in Part IV.2"],["Station","The 4th St west entrance stays at Hill and 4th, rebuilt step-free; its stairs and escalators drop to a passage at about EL 243 and on to the station box south of 4th<span class=\"cite\" data-k=\"T-NS\">&#8203;<\/span><span class=\"cite\" data-k=\"T-MS\">&#8203;<\/span>. A public lift and climb run from it up the slope to the tower and Olive","Metro keeps its right; an entrance agreement covers the rebuild"],["Shops and public ground floor","About 10,000–30,000 sf in the tower's base on Olive, with a small pavilion at the entrance on Hill (my estimate)","On the walk between the station, the market and Angels Flight"],["Community room and childcare","Size open","Part of the public ground floor"],["Resident amenity","At least 10% of dwelling area, about 50,000 sf (my arithmetic)<span class=\"cite\" data-k=\"172\">&#8203;<\/span>","Roof and shared floors"],["Public park","About 75% of the lot (my estimate), well over the 20% lot amenity minimum of about 19,211 sf<span class=\"cite\" data-k=\"172\">&#8203;<\/span>","Run by the conservancy"],["Parking","None for residents","The station and the public lift replace the garage"],["Not included","Hotel, office, clinic","A hotel would lose the CEQA exemption<span class=\"cite\" data-k=\"80\">&#8203;<\/span>"]]},{"t":"h3","html":"Rough block massing","id":"h15","text":"Rough block massing"},{"t":"fig","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 624 400\" width=\"100%\" font-family=\"Arial, Helvetica, sans-serif\" role=\"img\" aria-label=\"Rough block massing, plan: tower on the upper hill by Olive, park on the slope, Metro entrance kept at Hill and 4th, station box south of 4th\">\n  <defs>\n    <marker id=\"arr\" viewBox=\"0 0 8 8\" refX=\"7\" refY=\"4\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#111\"/><\/marker>\n  <\/defs>\n  <!-- streets -->\n  <rect x=\"34\" y=\"36\" width=\"44\" height=\"302\" fill=\"#e2e2df\"/>\n  <rect x=\"548\" y=\"36\" width=\"44\" height=\"362\" fill=\"#e2e2df\"/>\n  <rect x=\"34\" y=\"338\" width=\"558\" height=\"36\" fill=\"#e2e2df\"/>\n  <text x=\"56\" y=\"188\" font-size=\"10\" text-anchor=\"middle\" transform=\"rotate(-90 56 188)\" fill=\"#333\">OLIVE ST  (high side, about 70 ft above Hill)<\/text>\n  <text x=\"300\" y=\"360\" font-size=\"10\" text-anchor=\"middle\" fill=\"#333\">4TH ST<\/text>\n  <!-- Metro: twin bores under Hill St, station box south of 4th -->\n  <line x1=\"557\" y1=\"36\" x2=\"557\" y2=\"344\" stroke=\"#111\" stroke-width=\"1\" stroke-dasharray=\"6 4\"/>\n  <line x1=\"583\" y1=\"36\" x2=\"583\" y2=\"344\" stroke=\"#111\" stroke-width=\"1\" stroke-dasharray=\"6 4\"/>\n  <text x=\"570\" y=\"170\" font-size=\"8.5\" text-anchor=\"middle\" transform=\"rotate(90 570 170)\" fill=\"#111\">HILL ST  ·  METRO B/D LINE TWIN BORES BELOW<\/text>\n  <rect x=\"551\" y=\"344\" width=\"38\" height=\"54\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.6\"/>\n  <text x=\"570\" y=\"371\" font-size=\"7.5\" text-anchor=\"middle\" transform=\"rotate(90 570 371)\" fill=\"#111\">STATION<\/text>\n  <!-- Angels Flight edge -->\n  <rect x=\"88\" y=\"40\" width=\"450\" height=\"12\" fill=\"#cfcfca\"/>\n  <text x=\"313\" y=\"49\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#222\">ANGELS FLIGHT  (its own parcel)<\/text>\n  <!-- the lot -->\n  <rect x=\"88\" y=\"54\" width=\"450\" height=\"280\" fill=\"#e9eee3\" stroke=\"#111\" stroke-width=\"1.5\"/>\n  <!-- top of the slope, after the team's sections -->\n  <polyline points=\"88,108 210,100 300,108 326,170 306,280 286,334\" fill=\"none\" stroke=\"#6b6b66\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/>\n  <text x=\"250\" y=\"96\" font-size=\"8\" fill=\"#555\">top of the slope, about EL 350 (approx.)<\/text>\n  <!-- tower on the hill -->\n  <rect x=\"104\" y=\"126\" width=\"118\" height=\"124\" fill=\"#7d7d79\" stroke=\"#111\" stroke-width=\"1.5\"/>\n  <rect x=\"88\" y=\"126\" width=\"16\" height=\"124\" fill=\"#4b4b48\"/>\n  <text x=\"163\" y=\"166\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#fff\">TOWER<\/text>\n  <text x=\"163\" y=\"180\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#fff\">on the upper hill<\/text>\n  <text x=\"163\" y=\"192\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#fff\">about 14,000 sf plate<\/text>\n  <text x=\"163\" y=\"204\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#fff\">55–60 storeys<\/text>\n  <text x=\"163\" y=\"216\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#fff\">about 600 homes<\/text>\n  <text x=\"92\" y=\"264\" font-size=\"8\" fill=\"#111\">lobby and shops on Olive<\/text>\n  <!-- park -->\n  <text x=\"420\" y=\"132\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#111\">PUBLIC PARK ON THE SLOPE<\/text>\n  <text x=\"420\" y=\"146\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\">run by the conservancy; about 75% of the lot<\/text>\n  <text x=\"420\" y=\"158\" font-size=\"9\" text-anchor=\"middle\" fill=\"#333\">(my estimate); open now on a lease with no building<\/text>\n  <!-- old tanks and VOC zone near Hill and 4th -->\n  <ellipse cx=\"492\" cy=\"296\" rx=\"36\" ry=\"22\" fill=\"none\" stroke=\"#111\" stroke-width=\".8\" stroke-dasharray=\"2 2\"/>\n  <text x=\"452\" y=\"304\" font-size=\"8\" text-anchor=\"end\" fill=\"#111\">old tanks and VOC zone<\/text>\n  <!-- public lift and climb from the entrance up to the tower -->\n  <polyline points=\"526,324 448,236 360,250 300,214 228,190\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\" marker-end=\"url(#arr)\"/>\n  <text x=\"236\" y=\"276\" font-size=\"9\" fill=\"#111\">public lift and climb, entrance to tower and Olive<\/text>\n  <!-- the Metro entrance stays at the corner; its stairs and escalators run down to the passage -->\n  <circle cx=\"534\" cy=\"330\" r=\"7\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2\"/>\n  <text x=\"534\" y=\"333.5\" font-size=\"8\" font-weight=\"bold\" text-anchor=\"middle\">M<\/text>\n  <line x1=\"538\" y1=\"336\" x2=\"556\" y2=\"352\" stroke=\"#111\" stroke-width=\"2\"/>\n  <line x1=\"527\" y1=\"342\" x2=\"492\" y2=\"382\" stroke=\"#111\" stroke-width=\".8\"/>\n  <text x=\"120\" y=\"392\" font-size=\"9\" fill=\"#111\">METRO 4th St west entrance stays at the corner; stairs and escalators down to the station<\/text>\n  <!-- north arrow -->\n  <g transform=\"translate(16 300)\"><path d=\"M0,14 L5,0 L10,14 L5,10 z\" fill=\"#111\"/><text x=\"5\" y=\"27\" font-size=\"9\" text-anchor=\"middle\">N<\/text><\/g>\n<\/svg>\n","cap":"Figure 1. Plan. Schematic, not to scale: an illustrative placement, not a design. The station box sits south of 4th St; the twin bores run under Hill<span class=\"cite\" data-k=\"T-NS\">&#8203;<\/span><span class=\"cite\" data-k=\"T-MS\">&#8203;<\/span>."},{"t":"fig","svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 624 470\" width=\"100%\" font-family=\"Arial, Helvetica, sans-serif\" role=\"img\" aria-label=\"Rough block massing, east-west section: tower on the hill by Olive, park on the slope, Metro entrance, passage, station box and twin bores under Hill Street\">\n  <!-- vertical scale: y = 430 - (EL - 180) * 1.13; elevations NAVD88 ft -->\n  <g font-size=\"8\" fill=\"#555\" text-anchor=\"end\">\n    <line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"430\" stroke=\"#999\"/>\n    <text x=\"36\" y=\"409\">EL 200<\/text><text x=\"36\" y=\"352\">250<\/text><text x=\"36\" y=\"296\">300<\/text>\n    <text x=\"36\" y=\"239\">350<\/text><text x=\"36\" y=\"183\">400<\/text><text x=\"36\" y=\"126\">450<\/text><text x=\"36\" y=\"70\">500<\/text>\n  <\/g>\n  <!-- ground, after the team's sections: knoll top about EL 352, slope to Hill about EL 283 -->\n  <polygon points=\"60,236 300,238 340,252 430,303 470,309 470,314 610,314 610,430 60,430\" fill=\"#e2e2dc\"/>\n  <polygon points=\"60,306 300,306 430,330 610,345 610,430 60,430\" fill=\"#c9c9c2\"/>\n  <polyline points=\"60,236 300,238 340,252 430,303 470,309 470,314 610,314\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\"/>\n  <text x=\"70\" y=\"330\" font-size=\"8\" fill=\"#333\">siltstone (Fernando Fm.)<\/text>\n  <text x=\"70\" y=\"258\" font-size=\"8\" fill=\"#333\">fill and alluvium<\/text>\n  <!-- tower on the hill, broken at the top -->\n  <polygon points=\"110,236 110,30 140,22 170,30 200,22 230,30 230,236\" fill=\"#7d7d79\" stroke=\"#111\" stroke-width=\"1.5\"/>\n  <rect x=\"96\" y=\"214\" width=\"14\" height=\"22\" fill=\"#4b4b48\"/>\n  <text x=\"170\" y=\"92\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" fill=\"#fff\">TOWER<\/text>\n  <text x=\"170\" y=\"106\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#fff\">on the hill<\/text>\n  <text x=\"170\" y=\"118\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#fff\">base about EL 352<\/text>\n  <text x=\"62\" y=\"228\" font-size=\"9\" font-weight=\"bold\">OLIVE<\/text>\n  <!-- 85 ft above the tower's base -->\n  <line x1=\"60\" y1=\"140\" x2=\"470\" y2=\"140\" stroke=\"#111\" stroke-width=\".7\" stroke-dasharray=\"4 3\"/>\n  <text x=\"238\" y=\"136\" font-size=\"8.5\">85 ft above its base: CEQA exemption's labour package<\/text>\n  <!-- what the break hides -->\n  <g font-size=\"8.5\" fill=\"#111\">\n    <text x=\"250\" y=\"44\">The tower continues: 55–60 storeys, about 580–685 ft above<\/text>\n    <text x=\"250\" y=\"56\">its base on the hill, about EL 930–1,035 (my estimate).<\/text>\n    <text x=\"250\" y=\"70\">It also crosses 200 ft (FAA filing), 420 ft (LAFD helipad band)<\/text>\n    <text x=\"250\" y=\"82\">and 500 ft (Project Review trigger; probably exempt, UNVERIFIED).<\/text>\n  <\/g>\n  <!-- park and climb -->\n  <polyline points=\"468,300 430,296 336,244 300,231 234,229\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"/>\n  <text x=\"300\" y=\"222\" font-size=\"8.5\">public lift and climb, entrance to tower<\/text>\n  <text x=\"290\" y=\"296\" font-size=\"8.5\" fill=\"#333\">public park on the slope<\/text>\n  <text x=\"522\" y=\"308\" font-size=\"9\" font-weight=\"bold\">HILL ST<\/text>\n  <!-- Metro, after the team's Pershing Square sections and our Metro splat: entrance stairs and escalators to the passage (~EL 243), station box beyond (roof ~268, floor ~218), twin bores (TOR ~225, 42 ft c/c) -->\n  <polyline points=\"472,312 516,359 600,359\" fill=\"none\" stroke=\"#111\" stroke-width=\"1.6\" stroke-dasharray=\"6 3\"/>\n  <rect x=\"520\" y=\"331\" width=\"84\" height=\"56\" fill=\"none\" stroke=\"#111\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/>\n  <circle cx=\"540\" cy=\"370\" r=\"11\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/>\n  <circle cx=\"584\" cy=\"370\" r=\"11\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"1.3\"/>\n  <g font-size=\"8\" fill=\"#111\" text-anchor=\"end\">\n    <text x=\"464\" y=\"326\">4th St west entrance, at the corner:<\/text>\n    <text x=\"464\" y=\"336\">stairs and escalators to the passage, about EL 243<\/text>\n    <text x=\"508\" y=\"378\">station box beyond, south of 4th:<\/text>\n    <text x=\"508\" y=\"388\">roof about EL 268, floor about EL 218<\/text>\n  <\/g>\n  <text x=\"562\" y=\"402\" font-size=\"8\" text-anchor=\"middle\">METRO B/D Line twin bores<\/text>\n  <text x=\"562\" y=\"412\" font-size=\"7.5\" text-anchor=\"middle\" fill=\"#333\">top of rail about EL 225, 42 ft apart<\/text>\n  <text x=\"312\" y=\"452\" font-size=\"8.5\" text-anchor=\"middle\" fill=\"#444\">East–west section, looking north. Vertical scale true below the break; widths schematic.<\/text>\n  <text x=\"312\" y=\"464\" font-size=\"8\" text-anchor=\"middle\" fill=\"#555\">Ground and Metro after the team's site and Pershing Square sections and our Metro splat (team research).<\/text>\n<\/svg>\n","cap":"Figure 2. East–west section, looking north. Ground and Metro levels after the team's site sections and Pershing Square sections and our Metro splat<span class=\"cite\" data-k=\"T-NS\">&#8203;<\/span><span class=\"cite\" data-k=\"T-MS\">&#8203;<\/span>."},{"t":"p","html":"The massing is a test, not a design. The tower stands on the upper part of the hill, by Olive, where the team's site sections put the ground at about EL 350, some 70 ft above Hill St<span class=\"cite\" data-k=\"T-NS\">&#8203;<\/span>. The Metro entrance stays where it is, at Hill and 4th, and a public lift and climb run from it up the slope to the tower's base. Setting the tower back from Hill keeps it off the B/D Line bores, about 60 ft under the street, and away from the old tanks and vapour zone at the Hill and 4th corner<span class=\"cite\" data-k=\"T-NS\">&#8203;<\/span><span class=\"cite\" data-k=\"198\">&#8203;<\/span>; Metro's 8 ft and 5 ft shoring limits then fall on the entrance and lift works more than on the tower. The slope stays open as park, though the 10-storey street-wall rule on Hill, 4th and Olive still needs relief<span class=\"cite\" data-k=\"165\">&#8203;<\/span><span class=\"cite\" data-k=\"166\">&#8203;<\/span>. How the code measures height on a slope is UNVERIFIED (file 02)."},{"t":"h2","html":"IV.2 What our concept triggers","id":"h16","text":"IV.2 What our concept triggers"},{"t":"table","head":["Trigger","Why it applies","Decides","Duration","We produce, by when","It unlocks"],"rows":[["<b>(G) chain; the plan's value rule<\/b>","300+ homes, 25% lower-income for 55 years, every listed public body and sponsor invited<span class=\"cite\" data-k=\"65\">&#8203;<\/span>; the plan \"requires Fair Market Value\"<span class=\"cite\" data-k=\"N01-6\">&#8203;<\/span>","CRA/LA boards; DOF; HCD","Boards 1–2 months each (my estimate); DOF up to about 100 days, then a 60-day window<span class=\"cite\" data-k=\"75\">&#8203;<\/span><span class=\"cite\" data-k=\"76\">&#8203;<\/span>; HCD 30+ days<span class=\"cite\" data-k=\"116\">&#8203;<\/span>","Unit and affordability schedules: RFP. Benefit exhibits: before the boards","The (G) finding; an approved price"],["<b>Metro agreement; ZI 1117<\/b>","Portal built c. 1995<span class=\"cite\" data-k=\"198\">&#8203;<\/span>, instrument unlocated<span class=\"cite\" data-k=\"129\">&#8203;<\/span><span class=\"cite\" data-k=\"140\">&#8203;<\/span>; Metro clears permits within 100 ft<span class=\"cite\" data-k=\"239\">&#8203;<\/span>","Metro","Agreement UNVERIFIED; review 2–6 months a stage (my estimate)","Interface drawings: before the DDA. Submittal set, 8 ft and 5 ft buffers<span class=\"cite\" data-k=\"198\">&#8203;<\/span>: before shoring","Priced station scope; shoring permit"],["<b>21080.66; tribes; 85 ft labour<\/b>","Two-thirds housing, no hotel, consistent zoning, no uncleared Cortese site<span class=\"cite\" data-k=\"80\">&#8203;<\/span><span class=\"cite\" data-k=\"83\">&#8203;<\/span>; over 85 ft, prevailing wage, apprentices, health care<span class=\"cite\" data-k=\"84\">&#8203;<\/span>","City Planning; tribes","Tribal steps up to about 148 days (my arithmetic); entitlement 5–8 months (my estimate)","Housing-share schedule, height table: RFP. Tribal exhibits: within 14 days of completeness<span class=\"cite\" data-k=\"80\">&#8203;<\/span>","No EIR; 35-day suit window<span class=\"cite\" data-k=\"90\">&#8203;<\/span>"],["<b>Labor Code 1720<\/b>","A transfer \"for less than fair market price\" counts as public funds (reviewer A, leginfo<span class=\"cite\" data-k=\"N04-17\">&#8203;<\/span>)","DIR","Whole build","Labour note: RFP. Specifications: before the GMP","Cost certainty: wider reach, no new wage rate on the tower; (c)(2) argument open"],["<b>Project Review<\/b>","500 ft, or 500+ non-restricted homes<span class=\"cite\" data-k=\"162\">&#8203;<\/span>; the tower is over 500 ft","Director of Planning; LAHD","None if exempt; else 75 days, +45 by consent<span class=\"cite\" data-k=\"161\">&#8203;<\/span>","LAHD covenant evidence: before filing","Probably an exemption, with a 20%+ low-income LAHD covenant (UNVERIFIED); no linkage fee"],["<b>Street wall; G1 frontage<\/b>","10-storey minimum on the build-to frontage<span class=\"cite\" data-k=\"165\">&#8203;<\/span><span class=\"cite\" data-k=\"166\">&#8203;<\/span>; a wall on 90% of each primary street<span class=\"cite\" data-k=\"167\">&#8203;<\/span>; Hill, 4th and Olive probably all primary (UNVERIFIED)","City Planning; Zoning Administrator","Adjustment 4–9 months; Variance 6–12 (my estimate)","Frontage diagrams: RFP. Relief findings: filing","A park-first plan. Waivers are safest, reach UNVERIFIED; Variances only with counsel's comfort"],["<b>Amenity space<\/b>","20% of lot (about 19,211 sf; my arithmetic) and 10% of dwelling area; public space counts 1.25 to 1<span class=\"cite\" data-k=\"172\">&#8203;<\/span>","LADBS","Plan check","Amenity plan, crediting the public park: filing","Permit; park-fee credit<span class=\"cite\" data-k=\"164\">&#8203;<\/span>"],["<b>CPIO walkway<\/b>","Walkways stay open 5 a.m.–10:30 p.m. or are replaced<span class=\"cite\" data-k=\"186\">&#8203;<\/span>; one on Y-1 UNVERIFIED","Director of Planning","75 days<span class=\"cite\" data-k=\"161\">&#8203;<\/span>","Easement plan, the climb as replacement: filing","Moving the walkway"],["<b>Haul-route hearing<\/b>","Over 1,000 cy in a Hillside Grading Area<span class=\"cite\" data-k=\"210\">&#8203;<\/span>; the area is UNVERIFIED<span class=\"cite\" data-k=\"153\">&#8203;<\/span>","BBSC","8+ weeks plus a 10-day appeal, after CEQA<span class=\"cite\" data-k=\"211\">&#8203;<\/span>","Haul exhibit, 30,000–125,000 cy (my estimate): after CEQA","Grading permit"],["<b>SPRP peer review<\/b>","Engineered seismic design; a professor over 40 storeys<span class=\"cite\" data-k=\"205\">&#8203;<\/span>","LADBS panel","9–18 months (my estimate)","Envelope for the basis of design: schematic design","Early-start letters"],["<b>LAFD helipad<\/b>","Pads \"still required on all High-Rise buildings\"<span class=\"cite\" data-k=\"212\">&#8203;<\/span>; 420–1,000 ft can use a 2014 package<span class=\"cite\" data-k=\"213\">&#8203;<\/span>","LAFD","Plan check","Roof plan; fire command centre: schematic design","Building permit"],["<b>FAA 7460-1<\/b>","Over 200 ft, and each crane, 45 days before the permit application<span class=\"cite\" data-k=\"114\">&#8203;<\/span>; fuller study above 499 ft (UNVERIFIED)","FAA","2–6 months (my estimate)","Coordinates and heights: concept","The height confirmed"],["<b>Angels Flight<\/b>","Its own parcel since 22 Dec 2017<span class=\"cite\" data-k=\"129\">&#8203;<\/span><span class=\"cite\" data-k=\"140\">&#8203;<\/span>","Railway Foundation; OHR","UNVERIFIED","Interface and vibration plans: before grading","Building beside it"],["<b>COREA and title<\/b>","1983 easement agreement unread; a neighbour owns the air above 17 ft over Olive; Parcel 3 uninsurable<span class=\"cite\" data-k=\"129\">&#8203;<\/span>","Title insurer","1–3 months (my estimate)","Constraints plan: after the title report","Insurable title"],["<b>Tanks (Cortese)<\/b>","Three tanks at 357 S. Hill, abandoned 1967 (team research<span class=\"cite\" data-k=\"N04-2\">&#8203;<\/span>); VOCs to 190 ppm at 18 ft<span class=\"cite\" data-k=\"198\">&#8203;<\/span>; location UNVERIFIED","Consultant; SCAQMD","Phase I 3–6 weeks; Phase II 2–4 months (my estimate)","Tank overlay, tanks-first dig: before award","The Cortese answer; one price basis"]]},{"t":"p","html":"The tanks could reopen the route: an uncleared Cortese site loses the exemption, leaving a supplemental environmental report, 12–18 months and $0.6M–$1.2M (team memo estimate<span class=\"cite\" data-k=\"35\">&#8203;<\/span>). The rest is drawing work."},{"t":"h2","html":"IV.3 What a developer needs before committing","id":"h17","text":"IV.3 What a developer needs before committing"},{"t":"p","html":"A developer commits money only when eight things are true or priced. Each one waits on something we draw."},{"t":"table","head":["Necessity","By when","Unlocked by (our deliverable)","If it fails"],"rows":[["<b>Site control.<\/b> A (G) award, then a DDA binding the team to build and CRA/LA to convey, with obligations recorded at sale<span class=\"cite\" data-k=\"65\">&#8203;<\/span><span class=\"cite\" data-k=\"68\">&#8203;<\/span>","Award; DDA before closing","Competition package; DDA exhibits","No commission; the park keeps its keeper"],["<b>Land-cost certainty.<\/b> The residual land value (the finished building's worth, less every cost and a normal profit) must cover the station: $45M on our working assumption (team research<span class=\"cite\" data-k=\"N04-1\">&#8203;<\/span>)","Before the first appraisal: Jan–Apr 2027 fast (my estimate)","600-home test fit; area schedule; station scope with a floor and a ceiling","Shrink the scope, find added-scope funders, or use the ground-lease alternative"],["<b>Envelope and CEQA path.<\/b> About 6.8:1 by right; 21080.66; Project Review probably exempt (UNVERIFIED)","RFP; complete application","Height table; housing-share schedule; frontage diagrams; floor-area exhibit","A supplemental report, 12–18 months<span class=\"cite\" data-k=\"35\">&#8203;<\/span>"],["<b>A capital stack that closes.<\/b> A split building: a tax-credit part (about 150 homes) on 4% credits and HDFC bonds, and a market part (about 450; my arithmetic). Credits come in 2029 or later, after HDFC's bond pool ends in July 2029 (successor UNVERIFIED;<span class=\"cite\" data-k=\"123\">&#8203;<\/span>; my estimate). AHSC with Metro (up to $50M<span class=\"cite\" data-k=\"121\">&#8203;<\/span>) buys added scope only","Before construction close","Air-space parcel diagram; tax-credit drawings; a split of baseline and added scope","Phase it, or wait a round"],["<b>A buyer at completion.<\/b> A pension's forward commitment (team research<span class=\"cite\" data-k=\"N04-1\">&#8203;<\/span>), priced in the same competition as the land (my inference); ULA tax of about $22M on a $400M sale (my arithmetic)","Before the construction loan","Plans and specifications as the completion standard","The pension walks away"],["<b>Labour terms.<\/b> The 85 ft package; 1720 adds reach, not a new wage rate. Union pension money (AFL-CIO HIT) needs a union job, and stays non-federal only on a direct or Fannie Mae / Freddie Mac loan (web, review B<span class=\"cite\" data-k=\"N04-18\">&#8203;<\/span>)","Before the GMP","Height table; labour note; specifications","Wider reach priced into the GMP"],["<b>Metro's consent.<\/b> A letter of interest; the agreement before the DDA; approval before shoring","Stage 0 to shoring","Portal drawing; interface concept; submittal set","No station to buy; the land is repriced"],["<b>Clean title.<\/b> Title report, survey, a check for lawsuit notices","Before the RFP and closing","Constraints plan; reconciling 95,463, 96,056 and 97,631 sf<span class=\"cite\" data-k=\"140\">&#8203;<\/span><span class=\"cite\" data-k=\"190\">&#8203;<\/span>","Closing waits"]]},{"t":"p","html":"Two rules run through the table. The first is the double-counting rule from team research. If Metro paid $10M toward station work the developer must already do, the developer's costs would fall by $10M and the land price would rise by $10M (team research<span class=\"cite\" data-k=\"N04-1\">&#8203;<\/span>). So other public money buys only added scope. The second is fairness. The conservancy is not on our team: its funding and operating role is in the (G) terms for every bidder. Whether the DTLA Alliance will help form it is still to be asked."},{"t":"p","html":"None of these is unusual. What is unusual is that the price depends on all of them at once."},{"t":"h2","html":"IV.4 What the architect prepares at each stage","id":"h18","text":"IV.4 What the architect prepares at each stage"},{"t":"table","head":["Stage","Deliverable","Due by (06's fast case; my estimate)","Decision it unlocks","Reviewer"],"rows":[["<b>0 Step zero<\/b>","Interim park design for the conservancy: concept plan; a permit / no-permit list; access and safety plan; portal and Angels Flight interface; tank keep-out; cost and upkeep budget","Before the lease goes to the board; aim for 30 Jun 2027<span class=\"cite\" data-k=\"133\">&#8203;<\/span>","A no-development lease; the Knoll open","CRA/LA and counsel; conservancy"],["<b>0 Proof<\/b>","Zoning summary (HB5<span class=\"cite\" data-k=\"148\">&#8203;<\/span>); height table; 600-home test fit; area schedule; station scope with floor and ceiling; floor-area exhibit; constraints plan","Before the appraisal is instructed: Apr 2027","Go or no-go; the floor-area answer","Developer; counsel or Director of Planning; estimator"],["<b>0 Pricing<\/b>","Appraisal inputs at arm's length; the park's capital cost and the conservancy's operating budget, as terms for every bidder; an optional Oversight Board briefing","Before the solicitation terms are fixed: Sep 2027","Obligations, the park's keeper and a minimum price in the terms","CRA/LA; Oversight Board"],["<b>1 RFQ<\/b>","Qualifications: developer, HCD-listed affordable partner, architects, an engineer experienced beside live tunnels, estimator, counsel. Not the conservancy: it is in every bidder's terms","RFQ deadline (40 days in 2017;<span class=\"cite\" data-k=\"139\">&#8203;<\/span>)","Shortlist","CRA/LA panel"],["<b>1 RFP: the (G) package<\/b>","Concept and sections from Hill to Olive; unit, affordability and housing-share schedules; frontage and amenity plans; station interface and keep-open phasing; priced obligations and a residual pro forma; a table sorting every dollar; a price form: cash price subject to the obligations, possibly zero, plus added scope and its funder","RFP deadline (65 days in 2017;<span class=\"cite\" data-k=\"139\">&#8203;<\/span>); selection by about Jul 2028","Selection","CRA/LA panel; Metro"],["<b>2 ENA and DDA<\/b>","DDA exhibits: scope, schedule, station scope with a true-up (actual cost settled against priced), bond and reverter; park hours; unit-by-unit covenant schedule; (G) findings evidence","Before the declaration and DDA approval: by Apr 2029","DDA; the (G) finding","CRA/LA counsel"],["<b>2 Price approval<\/b>","Refreshed appraisal inputs if stale; inputs to the report on the price; board set; HCD exhibits","10 days before the Oversight Board<span class=\"cite\" data-k=\"75\">&#8203;<\/span>; 30 days before disposition<span class=\"cite\" data-k=\"116\">&#8203;<\/span>; Apr–Jun 2029","Deviation approval; DOF; HCD","Oversight Board; DOF; HCD"],["<b>3 Entitlement<\/b> (filed during the ENA)","Preliminary application; 21080.66 package with the Cortese check; CPIO checklist<span class=\"cite\" data-k=\"186\">&#8203;<\/span>; tribal exhibits; LAHD covenant evidence; haul exhibit; neighbourhood council pack","Filing Nov 2028; tribal exhibits 14 days after completeness<span class=\"cite\" data-k=\"80\">&#8203;<\/span>","Notice of exemption; Project Review exemption; haul hearing","City Planning; tribes; LAHD; BBSC"],["<b>4 Metro and edges<\/b>","Metro submittal set; entrance-agreement drawings; Angels Flight interface; COREA exhibits; air-rights check","Agreement by Mar 2029; Metro approval before shoring","ZI 1117 clearance; signed agreement","Metro; Foundation; COREA parties"],["<b>5 Permits and money<\/b>","Structural basis of design; FAA coordinates; LAFD roof plan; tax-credit drawings; air-space map; forward-commitment specifications; GMP documents","Close about Oct 2029; first permit Jan–Apr 2030","Permits; credits; construction loan; GMP","LADBS; FAA; LAFD; HDFC; pension; lender"],["<b>6 Construction<\/b>","Metro monitoring; station as-builts and true-up; park hand-over to the conservancy; completion set for the pension","2030 to 2033/34","Bond release; true-up; pension purchase","Metro; CRA/LA; conservancy; pension"]]},{"t":"p","html":"Three lines keep the work clean. We design the park; the conservancy holds the lease. Every study we fund goes into the data room for all bidders, and neither we nor the conservancy draft or score the solicitation (04 §11.3). The price form shows land and works separately, so the Oversight Board can test each (05 stage 1A)."},{"t":"p","html":"The work is front-loaded. Most of what sets the price is drawn before anyone bids."},{"t":"h2","html":"IV.5 Timeline and critical path","id":"h19","text":"IV.5 Timeline and critical path"},{"t":"table","head":["Stage","Duration","Fast case","Planning case"],"rows":[["Step zero","Set-up, lease 2–4 months each; works 6–12","Lease Jun 2027; park early 2028","Lease Dec 2027; park mid-2028"],["Pricing gate","Floor-area opinion and first appraisal, 2–4 months each","Jan–Aug 2027","Jan 2027–Feb 2028"],["Competition","Drafting 3–6 months; about 8 months to selection<span class=\"cite\" data-k=\"139\">&#8203;<\/span>","Award Aug 2028","Award Jun 2029"],["Price approval","Boards; DOF up to about 100 days; 60-day window","Apr–Jun 2029","Jul–Nov 2030"],["Entitlement and close","About 5–8 months; 35-day window","Close Oct 2029","Close Feb 2031"],["First permit","Haul hearing, Metro, SPRP","Jan–Apr 2030","Jul–Oct 2031"],["Construction","3.5–4.5 years","To 2033/34","To 2035/36"],["Pension purchase","Lease-up 12–24 months","2034–35","2036–37"]]},{"t":"p","html":"Durations and dates are my estimate (06 §5) unless sourced, with no supplemental report, lawsuit or failed residual test: about 7 to 11 years to the pension purchase (my arithmetic)."},{"t":"p","html":"<b>Critical path<\/b> (my inference): floor-area opinion, station estimate and pro forma → first appraisal → solicitation → selection → ENA and entitlement filing → Governing Board, Oversight Board, DOF → DDA → entitlement final → close → haul, Metro and peer-review sign-offs → shoring permit → excavation → tower → pension purchase. The interim park has float: it builds standing, but nothing waits for it."},{"t":"p","html":"<b>External dates.<\/b>"},{"t":"li","mk":"•","html":"<b>30 Jun 2027:<\/b> the DTLA Alliance contract ends<span class=\"cite\" data-k=\"133\">&#8203;<\/span>: the natural deadline for step zero."},{"t":"li","mk":"•","html":"<b>31 Dec 2027:<\/b> the last date for a sale under the old Surplus Land Act rules, later if the litigation toll applies<span class=\"cite\" data-k=\"68\">&#8203;<\/span>. It is not a sale deadline and does not touch the base case."},{"t":"li","mk":"•","html":"<b>1 Dec 2028:<\/b> the 2014 Bunker Hill refunding bond matures (team research<span class=\"cite\" data-k=\"N04-3\">&#8203;<\/span>). After that, a new tower's increment reaches the taxing entities, a reason for the Oversight Board to accept a lower price (my inference)."},{"t":"li","mk":"•","html":"<b>HDFC and AHSC:<\/b> HDFC's 2027 Round 1 runs January to August, and Round 2 to winter 2027–28<span class=\"cite\" data-k=\"123\">&#8203;<\/span>; we apply in 2029 or later (my estimate). AHSC Round 10 awards in December 2026<span class=\"cite\" data-k=\"121\">&#8203;<\/span>; we aim later."},{"t":"p","html":"The calendar is long, but the first year is cheap. The pricing gate costs a few opinions, not a building."},{"t":"h2","html":"IV.6 Top 5 risks and what would settle them","id":"h20","text":"IV.6 Top 5 risks and what would settle them"},{"t":"p","html":"Ratings are 07's (my estimate there)."},{"t":"table","head":["Rank","Risk","Likelihood / impact","Effect on the path","What would settle it"],"rows":[["1","<b>R2 The residual test.<\/b> Team research reports the last developer said no project pencils (team research<span class=\"cite\" data-k=\"N04-1\">&#8203;<\/span>); a second team assessment, on another measure, finds land value below zero (team research<span class=\"cite\" data-k=\"N04-5\">&#8203;<\/span>)","Medium to High / Fatal for the swap","Below $45M the land is \"simply cheap, not traded\" (team research), and someone else pays for the station","A pro forma on the 600-home case with an independent estimate, by the team's cost and finance leads"],["2","<b>R1 The price approval.<\/b> The Oversight Board owes duties to the taxing entities<span class=\"cite\" data-k=\"76\">&#8203;<\/span>; we found no below-market CRA/LA sale since 2014, and Marlton Square (2024) sold at market value<span class=\"cite\" data-k=\"N01-8\">&#8203;<\/span>","Medium to High / High","Refusal means re-appraisal or re-bid: 6–12 months a cycle (my estimate)","An early briefing; every obligation recorded; the bond argument (team research); the plan as modified in 2014"],["3","<b>R6 CRA/LA inaction.<\/b> No regular Governing Board meeting from 1 Jan to 1 Oct 2026<span class=\"cite\" data-k=\"135\">&#8203;<\/span>; the notice directed by Resolution 25-02 had not been issued as of the last check<span class=\"cite\" data-k=\"119\">&#8203;<\/span>","High / High","Nothing starts until it meets; if the notice issues first, about 5–6 months more (my estimate)","Findings at a clearly regular meeting superseding 25-02; capacity offered at arm's length"],["4","<b>R8 Metro as counterparty.<\/b> Team research says Metro has no acquisition budget and three working portals (team research<span class=\"cite\" data-k=\"N04-2\">&#8203;<\/span>)","Medium / High","Without Metro's approval, the appraisal can't subtract the works","A letter of interest on a set scope; the case for step-free access (UNVERIFIED that none exists)"],["5","<b>R10 The lawsuits.<\/b> A federal \"Settlement\" entry with unknown terms<span class=\"cite\" data-k=\"143\">&#8203;<\/span>; LASC 24STCV32173 pending, with a stipulated stay reported since Nov 2025 (team research;<span class=\"cite\" data-k=\"144\">&#8203;<\/span>)","Medium that it delays / High","Title, timing and the agency's will to act","The settlement terms; a lawsuit-notice check"]]},{"t":"p","html":"Next: floor area (R5), station cost (R3), tanks (R11) and fairness (R14). A team estimate of about $115M for the station (team research<span class=\"cite\" data-k=\"27\">&#8203;<\/span>) sits in R3, set aside for later review: if the station costs more than the land is worth, the write-down stops at zero and the project pays the excess (07 R3)."},{"t":"p","html":"The first risk is a spreadsheet, not a board. It should be run before we draw much more."},{"t":"h2","html":"IV.7 Alternatives","id":"h21","text":"IV.7 Alternatives"},{"t":"table","head":["Scheme","Size and form","What changes"],"rows":[["<b>Base: one tower<\/b>","About 600 homes; 55–60 storeys, about 580–685 ft (my estimate)","The 2014 helipad package; the SPRP professor; a fuller FAA study (UNVERIFIED)"],["<b>Two towers<\/b> (note)","30–35 storeys, about 330–420 ft each (my estimate)","A pad or LAFD alternative on each roof<span class=\"cite\" data-k=\"212\">&#8203;<\/span>; may cross 420 ft at 35 storeys"],["<b>Code maximum<\/b>","About 1,050–1,150 homes<span class=\"cite\" data-k=\"32\">&#8203;<\/span>","A Community Benefits bonus toward the 13:1 floor-area ceiling<span class=\"cite\" data-k=\"171\">&#8203;<\/span>; height is a separate rule; Project Review unless exempt"],["<b>Two-phase scheme<\/b>","About 600 homes, 705 ft (team research<span class=\"cite\" data-k=\"1\">&#8203;<\/span>)","One DDA with phased takedowns (UNVERIFIED); haul and Metro review possibly twice"],["<b>Station Homes scheme<\/b>","500 homes, about 10 storeys (team research<span class=\"cite\" data-k=\"27\">&#8203;<\/span>)","No Project Review; federal review if FHA, TIFIA or ASAP money is used"],["<b>Ground-lease alternative<\/b>","Same building; a 99-year lease, bids of base rent and a leased-fee price (team research)","A City ordinance (now \"probably unnecessary\", he says) and a state amendment to HSC 34191.5(c)(2), 12–24 months (my estimate); a second disposal"]]},{"t":"p","html":"Each alternative moves a cost. None removes the Oversight Board."},{"t":"h2","html":"IV.8 Disclaimer, labels and terms","id":"h22","text":"IV.8 Disclaimer, labels and terms"},{"t":"p","html":"Studio work for the Syracuse University LA Studio; not legal, financial or investment advice."},{"t":"p","html":"<b>Labels.<\/b> Numbers in the right margin are sources, numbered in the order they first appear and listed in full at the end; click one to open it. <b>(my estimate)<\/b>, <b>(my arithmetic)<\/b>, <b>(my inference)<\/b>: the drafting agents' work. <b>(team research)<\/b>: a teammate's work, not verified by us. <b>UNVERIFIED<\/b>: not confirmed against a primary source. <b>R1–R20<\/b> and \"04 §11.3\": risk IDs and sections in the v2 reference files."},{"t":"p","html":"<b>Terms.<\/b>"},{"t":"li","mk":"•","html":"<b>CRA/LA; Oversight Board; DOF:<\/b> the owner, winding down the old redevelopment agency; the county board for the taxing bodies; state finance. CRA/LA's <b>property plan<\/b> (LRPMP) requires fair market value."},{"t":"li","mk":"•","html":"<b>(G); HCD:<\/b> the Surplus Land Act exemption for an open competition; the state housing department."},{"t":"li","mk":"•","html":"<b>21080.66; Cortese; ZI 1117:<\/b> the 2025 infill exemption from CEQA; the state list of contaminated sites; Metro's permit clearance."},{"t":"li","mk":"•","html":"<b>COREA; G1; HB5; CPIO:<\/b> a 1983 easement agreement; the frontage rule; the zone; the Downtown overlay."},{"t":"li","mk":"•","html":"<b>SPRP; BBSC; OHR; LAHD:<\/b> structural peer review; the haul-route board; historic resources; City housing."},{"t":"li","mk":"•","html":"<b>HDFC; AHSC; ULA; GMP:<\/b> state housing finance; a housing-and-transit grant; the City's tax on large sales; a guaranteed-price contract."}];

<script>
(function(){
  const book = document.getElementById("book");
  const editBtn = document.getElementById("edit"), copyBtn = document.getElementById("savecopy"), discardBtn = document.getElementById("discard"), note = document.getElementById("note");
  const KEY = "knoll-brief-edits";
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const say = t => { note.textContent = t; };

  // Edits kept in this browser, for this build of the file only.
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "null");
    if (saved && saved.build === BUILD && Array.isArray(saved.blocks)) {
      BLOCKS = saved.blocks; TITLE = saved.title || TITLE;
      discardBtn.hidden = false; say("Showing your saved edits from this browser.");
    }
  } catch (e) {}
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify({ build: BUILD, blocks: BLOCKS, title: TITLE })); return true; } catch (e) { return false; }
  }

  let pages = [];
  function newPage(){
    const pg = document.createElement("section"); pg.className = "page";
    const c = document.createElement("div"); c.className = "content";
    const s = document.createElement("div"); s.className = "srcs";
    const f = document.createElement("div"); f.className = "folio";
    pg.append(c, s, f); book.appendChild(pg); pages.push(pg); return c;
  }
  const over = c => c.scrollHeight > c.clientHeight + 1;

  // Sentence-level split of a paragraph's HTML, only where no tag is open.
  function sentences(h){
    const out = []; let depth = 0, last = "", start = 0;
    for (let i = 0; i < h.length; i++) {
      const ch = h[i];
      if (ch === "<") {
        const j = h.indexOf(">", i); const tag = h.slice(i, j + 1);
        if (/^<\//.test(tag)) depth--; else if (!/\/>$/.test(tag)) depth++;
        i = j; continue;
      }
      if (ch === " " && depth === 0 && /[.;:?!]/.test(last)) { out.push(h.slice(start, i)); start = i + 1; }
      if (ch !== " ") last = ch;
    }
    out.push(h.slice(start));
    return out.filter(s => s.trim());
  }
  function el(b, htmlOverride){
    if (b.t === "p") { const p = document.createElement("p"); p.innerHTML = htmlOverride ?? b.html; return p; }
    if (b.t === "li") { const d = document.createElement("div"); d.className = "li"; d.innerHTML = '<span class="mk"></span><div class="tx"></div>'; d.firstChild.textContent = b.mk; d.lastChild.innerHTML = htmlOverride ?? b.html; return d; }
    if (b.t === "pre") { const p = document.createElement("pre"); p.innerHTML = b.html; return p; }
    if (b.t === "fig") { const f = document.createElement("figure"); f.innerHTML = b.svg + "<figcaption>" + b.cap + "</figcaption>"; return f; }
    if (/^h[123]$/.test(b.t)) { const h = document.createElement(b.t); h.innerHTML = b.html; h.id = b.id; return h; }
  }
  function tableShell(b){
    const tb = document.createElement("table");
    tb.innerHTML = "<thead><tr>" + b.head.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody></tbody>";
    return tb;
  }

  // ---- The paged view.
  function layout(){
    book.innerHTML = ""; pages = []; book.style.zoom = 1;
    const t = newPage();
    t.innerHTML = '<div class="titlepage"><div class="t1"></div><div class="t2"></div><div class="t3 a"></div><div class="t3 b"></div><div class="t3 c"></div><div class="t4"></div></div>';
    t.querySelector(".t1").textContent = TITLE.head; t.querySelector(".t2").textContent = TITLE.sub;
    t.querySelector(".a").textContent = TITLE.place; t.querySelector(".b").textContent = TITLE.authors;
    t.querySelector(".c").textContent = TITLE.org; t.querySelector(".t4").textContent = TITLE.note;
    const tocC = newPage(); tocC.classList.add("toc");

    let c = newPage();
    const isHeading = n => n && /^H[123]$/.test(n.tagName);
    function carryHeading(){
      const moved = [];
      while (isHeading(c.lastElementChild) && c.children.length > 1) moved.unshift(c.removeChild(c.lastElementChild));
      c = newPage();
      moved.forEach(m => c.appendChild(m));
    }
    for (const b of BLOCKS) {
      if (b.t === "h1" && c.children.length) c = newPage();
      if (b.t === "table") {
        let tb = tableShell(b); c.appendChild(tb);
        if (over(c)) { c.removeChild(tb); carryHeading(); tb = tableShell(b); c.appendChild(tb); }
        let body = tb.tBodies[0];
        for (const r of b.rows) {
          const tr = document.createElement("tr"); tr.innerHTML = r.map(x => "<td>" + x + "</td>").join("");
          body.appendChild(tr);
          if (over(c)) {
            body.removeChild(tr);
            if (!body.rows.length) { c.removeChild(tb); carryHeading(); }
            else c = newPage();
            tb = tableShell(b); c.appendChild(tb); body = tb.tBodies[0]; body.appendChild(tr);
          }
        }
        continue;
      }
      const node = el(b); c.appendChild(node);
      if (!over(c)) continue;
      c.removeChild(node);
      if ((b.t === "p" || b.t === "li") && c.children.length) {
        const parts = sentences(b.html); let k = 0, part = null;
        for (let n = parts.length - 1; n >= 1; n--) {
          part = el(b, parts.slice(0, n).join(" ")); c.appendChild(part);
          if (!over(c)) { k = n; break; }
          c.removeChild(part); part = null;
        }
        if (k) {
          c = newPage();
          const rest = el({ t: "p" }, parts.slice(k).join(" ")); rest.className = "cont";
          if (b.t === "li") { rest.style.marginLeft = "42px"; }
          c.appendChild(rest); continue;
        }
      }
      carryHeading(); c.appendChild(node);
    }

    // Source list, numbered by first use.
    const order = [], num = {};
    for (const s of book.querySelectorAll(".cite")) { const k = s.dataset.k; if (!(k in num)) { order.push(k); num[k] = order.length; } }
    c = newPage();
    const h = document.createElement("h1"); h.textContent = "Sources"; h.id = "sources"; c.appendChild(h);
    const intro = document.createElement("p");
    intro.textContent = "Numbered in the order they first appear. Local paths open files in the LA Studio OneDrive folder; a teammate's file is theirs and is not verified by us.";
    c.appendChild(intro);
    let list = document.createElement("div"); list.className = "srclist"; c.appendChild(list);
    for (const k of order) {
      const s = SRC[k] || { title: "Source " + k, href: "" };
      const row = document.createElement("div"); row.className = "s"; row.id = "src-" + num[k];
      row.innerHTML = '<span class="n"></span><span class="b"></span>';
      row.firstChild.textContent = num[k] + ".";
      const bx = row.lastChild; bx.textContent = s.title + " ";
      if (s.href) { const a = document.createElement("a"); a.href = s.href; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.href.startsWith("http") ? s.href : "local file: " + decodeURI(s.href).split("/").pop(); bx.appendChild(a); }
      list.appendChild(row);
      if (over(c)) { list.removeChild(row); c = newPage(); list = document.createElement("div"); list.className = "srclist"; c.appendChild(list); list.appendChild(row); }
    }

    // Margin numbers: level with the citing line, grouped when they share a line.
    pages.forEach((pg, pi) => {
      const box = pg.querySelector(".srcs"), top0 = pg.querySelector(".content").getBoundingClientRect().top;
      const hits = [...pg.querySelectorAll(".content .cite")].map(s => ({ y: Math.round(s.getBoundingClientRect().top - top0), k: s.dataset.k })).sort((a, b) => a.y - b.y);
      const marks = [];
      hits.forEach(hh => {
        const last = marks[marks.length - 1];
        if (last && hh.y - last.y < 13 && last.ks.length < 4) { if (!last.ks.includes(hh.k)) last.ks.push(hh.k); }
        else marks.push({ y: hh.y, ks: [hh.k] });
      });
      let floor = -99;
      marks.forEach(m => {
        const y = Math.max(m.y, floor + 13);
        m.ks.forEach((k, i) => {
          const s = SRC[k] || {};
          const a = document.createElement("a");
          a.style.top = y + "px"; a.style.left = (i * 2.1) + "em";
          a.href = s.href || ("#src-" + num[k]);
          if (s.href) { a.target = "_blank"; a.rel = "noopener"; }
          a.title = (s.title || ("Source " + k));
          a.innerHTML = "<span></span>"; a.firstChild.textContent = num[k];
          box.appendChild(a);
        });
        floor = y;
      });
      if (pi > 0) pg.querySelector(".folio").textContent = pi + 1;
    });

    // Contents with page numbers.
    const where = id => pages.findIndex(pg => pg.querySelector("#" + CSS.escape(id))) + 1;
    const ttl = document.createElement("div"); ttl.className = "ttl"; ttl.textContent = "Contents"; tocC.appendChild(ttl);
    const heads = BLOCKS.filter(b => b.t === "h1" || b.t === "h2").map(b => ({ id: b.id, text: b.text, lv: b.t }));
    heads.push({ id: "sources", text: "Sources", lv: "h1" });
    for (const hd of heads) {
      const a = document.createElement("a"); a.href = "#" + hd.id; a.className = hd.lv === "h2" ? "l2" : "l1";
      a.innerHTML = '<span class="nm"></span><span class="lead"></span><span class="pn"></span>';
      a.firstChild.textContent = hd.text; a.lastChild.textContent = where(hd.id);
      tocC.appendChild(a);
    }
    fit();
  }

  // ---- The draft view: every block in one editable column.
  function draft(){
    book.innerHTML = ""; pages = []; book.style.zoom = 1;
    const pg = document.createElement("section"); pg.className = "page draft";
    const c = document.createElement("div"); c.className = "content"; pg.appendChild(c); book.appendChild(pg);
    const tf = document.createElement("div"); tf.className = "tfs";
    const lbl = document.createElement("p"); lbl.className = "lbl"; lbl.textContent = "Title page"; tf.appendChild(lbl);
    for (const k of ["head", "sub", "place", "authors", "org", "note"]) {
      const p = document.createElement("p"); p.dataset.title = k; p.className = "tf-" + k; p.contentEditable = "true"; p.textContent = TITLE[k]; tf.appendChild(p);
    }
    c.appendChild(tf);
    BLOCKS.forEach((b, i) => {
      let n;
      if (b.t === "table") {
        n = document.createElement("table");
        n.innerHTML = "<thead><tr>" + b.head.map(x => "<th>" + x + "</th>").join("") + "</tr></thead><tbody>" +
          b.rows.map(r => "<tr>" + r.map(x => "<td>" + x + "</td>").join("") + "</tr>").join("") + "</tbody>";
        n.querySelectorAll("th,td").forEach(x => { x.contentEditable = "true"; });
      } else {
        n = el(b);
        if (b.t === "li") n.querySelector(".tx").contentEditable = "true";
        else if (b.t === "fig") n.querySelector("figcaption").contentEditable = "true";
        else if (b.t === "pre") n.contentEditable = "plaintext-only";
        else n.contentEditable = "true";
      }
      n.dataset.i = i; c.appendChild(n);
    });
    c.querySelectorAll(".cite").forEach(s => { s.contentEditable = "false"; });
    fit();
  }
  const clean = h => h.replace(/ contenteditable="false"/g, "").replace(/<\/?div[^>]*>/g, " ").replace(/<br\s*\/?>/g, " ").replace(/\s+$/, "");
  function readBack(){
    book.querySelectorAll("[data-title]").forEach(p => { TITLE[p.dataset.title] = p.textContent.trim(); });
    book.querySelectorAll("[data-i]").forEach(n => {
      const b = BLOCKS[+n.dataset.i];
      if (b.t === "table") {
        b.head = [...n.tHead.rows[0].cells].map(x => clean(x.innerHTML));
        b.rows = [...n.tBodies[0].rows].map(r => [...r.cells].map(x => clean(x.innerHTML)));
      } else if (b.t === "li") b.html = clean(n.querySelector(".tx").innerHTML);
      else if (b.t === "fig") b.cap = clean(n.querySelector("figcaption").innerHTML);
      else if (b.t === "pre") b.html = esc(n.textContent);
      else { b.html = clean(n.innerHTML); if (/^h/.test(b.t)) b.text = n.textContent.replace(/\u200b/g, "").trim(); }
    });
  }

  // Keep blocks whole: Enter does not split a paragraph; pasted text arrives as plain text.
  book.addEventListener("keydown", e => { if (editing && e.key === "Enter" && !e.target.closest("pre")) e.preventDefault(); });
  book.addEventListener("paste", e => {
    if (!editing) return;
    e.preventDefault();
    document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain").replace(/\s*\n\s*/g, " "));
  });

  let editing = false;
  editBtn.addEventListener("click", () => {
    if (!editing) {
      editing = true; draft();
      editBtn.textContent = "Done editing"; editBtn.setAttribute("aria-pressed", "true");
      say("Click any text to change it. Done editing lays the pages out again.");
    } else {
      readBack(); editing = false;
      const kept = persist(); discardBtn.hidden = false;
      layout();
      editBtn.textContent = "Edit text"; editBtn.setAttribute("aria-pressed", "false");
      say(kept ? "Edits saved in this browser. Save a copy to keep them in a file." : "Edits applied, but this browser could not store them: use Save a copy.");
    }
  });
  copyBtn.addEventListener("click", () => {
    if (editing) readBack();
    const clone = document.documentElement.cloneNode(true);
    clone.querySelector("#book").innerHTML = "";
    clone.querySelector("#note").textContent = "";
    const ed = clone.querySelector("#edit"); ed.textContent = "Edit text"; ed.setAttribute("aria-pressed", "false");
    clone.querySelector("#discard").hidden = true;
    const s = x => JSON.stringify(x).replace(/<\//g, "<\\/");
    clone.querySelector("#data").textContent = "\nlet BLOCKS = " + s(BLOCKS) + ";\nlet TITLE = " + s(TITLE) + ";\nconst SRC = " + s(SRC) + ";\nconst BUILD = " + s(BUILD + "-edited-" + Date.now()) + ";\n";
    const blob = new Blob(["<!doctype html>\n" + clone.outerHTML], { type: "text/html" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "Angels-Knoll_Brief_edited.html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    say("Saved a copy with your edits.");
  });
  discardBtn.addEventListener("click", () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    location.reload();
  });

  function fit(){ const z = Math.min(1, (document.documentElement.clientWidth - 24) / 816); book.style.zoom = z; }
  addEventListener("resize", fit);
  layout();
})();
</script>
</body>
